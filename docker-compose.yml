# Frontend seul :  docker compose up --build -d   (dans ce dossier)
# Interface : http://localhost:3000 — le backend doit tourner sur NEXT_PUBLIC_API_URL.
# Pour lancer backend + frontend ensemble, voir ../../docker-compose.yml
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ansd-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
